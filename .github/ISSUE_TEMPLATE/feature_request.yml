name: Feature request
description: Suggest an improvement for MergeFilesByExtension
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the project.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Explain the use case behind the request.
      placeholder: Describe the problem or workflow you want to improve.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the feature you would like to see.
      placeholder: Describe your idea.
    validations:
      required: true
